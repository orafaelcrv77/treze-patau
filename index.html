<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treze — quiz sobre a síndrome de Patau</title>
<meta http-equiv="refresh" content="0; url=/treze/">
<link rel="canonical" href="/treze/">
<meta name="robots" content="noindex">
<style>
  html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:#080d11;color:#f4efe6;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
  a{color:#ff4b3e}
  .d{width:9px;height:9px;border-radius:50%;background:#ff4b3e;display:inline-block;margin:0 4px;
    animation:p 1.1s ease-in-out infinite}
  .d:nth-child(2){animation-delay:.15s}.d:nth-child(3){animation-delay:.3s}
  @keyframes p{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}
</style>
</head>
<body>
  <div>
    <p><span class="d"></span><span class="d"></span><span class="d"></span></p>
    <p style="margin-top:14px;font-size:15px;opacity:.7">Abrindo o jogo…</p>
    <p style="margin-top:10px;font-size:14px"><a href="/treze/">Se não abrir, toque aqui</a></p>
  </div>
  <script>location.replace("/treze/");</script>
</body>
</html>
